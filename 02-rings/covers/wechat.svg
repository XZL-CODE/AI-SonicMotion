<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="600" viewBox="0 0 1410 600">
  <!-- More Rings Than Years · 年轮 — 公众号 headline cover, 2.35:1.
       All text stays inside the centre 600 × 600 (x 405–1005), which the 1:1 share card crops;
       the sides carry only the rings. The pith lies below the frame, so the rings arch over the title. -->
  <style>
    @font-face { font-family: "Cormorant Garamond"; font-weight: 300 700;
                 src: url("../../.tools/fonts/CormorantGaramond%5Bwght%5D.ttf"); }
    @font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 300 700;
                 src: url("../../.tools/fonts/CormorantGaramond-Italic%5Bwght%5D.ttf"); }
    @font-face { font-family: "Noto Serif SC"; font-weight: 200 900;
                 src: url("../../.tools/fonts/NotoSerifSC%5Bwght%5D.ttf"); }
    .en { font-family: "Cormorant Garamond", "Baskerville", "Didot", serif; }
    .zh { font-family: "Noto Serif SC", "Songti SC", "STSong", serif; }
    text { fill: #fff4e4; text-anchor: middle; }
  </style>

  <defs>
    <radialGradient id="wood" cx="705" cy="1010" r="1160" gradientUnits="userSpaceOnUse">
      <stop offset="0.4" stop-color="#6e4628"/>
      <stop offset="0.75" stop-color="#5a3820"/>
      <stop offset="1" stop-color="#43291a"/>
    </radialGradient>
    <!-- the text sits in a soft pool of shade -->
    <radialGradient id="shade" cx="705" cy="340" r="400" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(705 340) scale(1 0.62) translate(-705 -340)">
      <stop offset="0" stop-color="#0c0806" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#0c0806" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0c0806" stop-opacity="0"/>
    </radialGradient>
    <!-- light raking across the face from the upper left -->
    <radialGradient id="sheen" cx="260" cy="120" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="705" cy="300" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#050403" stop-opacity="0"/>
      <stop offset="1" stop-color="#050403" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="bark" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="ink" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="7" flood-color="#0a0604" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="1410" height="600" fill="#0b0806"/>

  <!-- bark showing at the top corners, then the face -->
  <circle cx="705" cy="1010" r="1178" fill="#1c120c" filter="url(#bark)"/>
  <circle cx="705" cy="1010" r="1158" fill="url(#wood)" filter="url(#grain)"/>

  <!-- latewood lines, one closing each year -->
  <g fill="none" stroke="#2a170c" stroke-opacity="0.75" filter="url(#grain)">
    <circle cx="705" cy="1010" r="452" stroke-width="5"/>
    <circle cx="705" cy="1010" r="476" stroke-width="4"/>
    <circle cx="704" cy="1010" r="505" stroke-width="5"/>
    <circle cx="704" cy="1009" r="527" stroke-width="3"/>
    <circle cx="705" cy="1010" r="556" stroke-width="5"/>
    <circle cx="704" cy="1009" r="583" stroke-width="5"/>
    <circle cx="704" cy="1009" r="604" stroke-width="3"/>
    <circle cx="703" cy="1009" r="632" stroke-width="5"/>
    <circle cx="704" cy="1008" r="661" stroke-width="5"/>
    <circle cx="703" cy="1009" r="679" stroke-width="3"/>
    <circle cx="703" cy="1008" r="712" stroke-width="5"/>
    <circle cx="703" cy="1008" r="738" stroke-width="4"/>
    <circle cx="702" cy="1008" r="764" stroke-width="5"/>
    <circle cx="703" cy="1007" r="786" stroke-width="3"/>
    <circle cx="702" cy="1008" r="815" stroke-width="5"/>
    <circle cx="702" cy="1007" r="840" stroke-width="5"/>
    <circle cx="702" cy="1007" r="886" stroke-width="5"/>
    <circle cx="701" cy="1007" r="909" stroke-width="3"/>
    <circle cx="702" cy="1006" r="937" stroke-width="5"/>
    <circle cx="701" cy="1006" r="966" stroke-width="5"/>
    <circle cx="701" cy="1006" r="1012" stroke-width="5"/>
    <circle cx="700" cy="1006" r="1041" stroke-width="4"/>
    <circle cx="701" cy="1005" r="1066" stroke-width="5"/>
    <circle cx="700" cy="1005" r="1102" stroke-width="5"/>
    <circle cx="700" cy="1005" r="1131" stroke-width="4"/>
  </g>

  <!-- radial checks, splitting in from the bark -->
  <g fill="none" stroke="#1a0e07" stroke-linecap="round" filter="url(#grain)">
    <path d="M 132 52 L 176 96 L 214 138" stroke-width="3" opacity="0.8"/>
    <path d="M 1262 40 L 1226 82 L 1196 120" stroke-width="2.5" opacity="0.7"/>
    <path d="M 22 228 L 76 248" stroke-width="2" opacity="0.6"/>
  </g>

  <rect width="1410" height="600" fill="url(#sheen)"/>

  <!-- false rings: years that grew twice -->
  <g fill="none" stroke="#ffe8c2" filter="url(#grain)">
    <circle cx="704" cy="1009" r="618" stroke-width="2" opacity="0.7"/>
    <circle cx="701" cy="1006" r="988" stroke-width="2" opacity="0.65"/>
    <circle cx="700" cy="1005" r="1084" stroke-width="1.8" opacity="0.55"/>
  </g>
  <g fill="none" stroke="#ffd79a" filter="url(#glow)" opacity="0.5">
    <circle cx="704" cy="1009" r="618" stroke-width="5"/>
    <circle cx="701" cy="1006" r="988" stroke-width="5"/>
  </g>

  <!-- the ring being counted, arching over the title -->
  <g filter="url(#grain)">
    <circle cx="702" cy="1007" r="862" fill="none" stroke="#ffb35c" stroke-width="18" opacity="0.5" filter="url(#glow)"/>
    <circle cx="702" cy="1007" r="862" fill="none" stroke="#ffe3ad" stroke-width="3.2"/>
  </g>
  <g fill="#fff6e2">
    <circle cx="338" cy="226" r="5.5"/>
    <circle cx="338" cy="226" r="16" opacity="0.35" filter="url(#glow)"/>
    <circle cx="250" cy="277" r="4.5"/>
    <circle cx="250" cy="277" r="13" opacity="0.3" filter="url(#glow)"/>
  </g>

  <rect width="1410" height="600" fill="url(#shade)"/>
  <rect width="1410" height="600" fill="url(#vignette)"/>

  <g fill="#ffd79a" filter="url(#soft)">
    <circle cx="1120" cy="96" r="2.5" opacity="0.6"/>
    <circle cx="150" cy="470" r="2" opacity="0.5"/>
    <circle cx="1290" cy="420" r="2.5" opacity="0.5"/>
  </g>

  <g filter="url(#ink)">
    <text class="zh" x="705" y="110" font-size="20" font-weight="500" letter-spacing="1.5" opacity="0.92">AI 原创 · 民谣 × Drum &amp; Bass</text>
    <text class="en" x="705" y="214" font-size="76" font-weight="500">More Rings</text>
    <text class="en" x="705" y="290" font-size="76" font-weight="500">Than Years</text>
    <text class="zh" x="721" y="374" font-size="50" font-weight="600" letter-spacing="32">年轮</text>
    <g stroke="#fff4e4" stroke-width="2" opacity="0.8">
      <line x1="560" y1="357" x2="625" y2="357"/>
      <line x1="785" y1="357" x2="850" y2="357"/>
    </g>
    <text class="en" x="705" y="440" font-size="29" font-style="italic" font-weight="500" opacity="0.96">You’ve got more rings than years</text>
    <text class="zh" x="707" y="478" font-size="20" font-weight="400" letter-spacing="4" opacity="0.92">你的年轮，比年纪还多</text>
  </g>
</svg>
